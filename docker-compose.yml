services:
  # PostgreSQL with pgvector for semantic search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cavia-postgres
    environment:
      POSTGRES_DB: cavia
      POSTGRES_USER: cavia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caviadev123}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cavia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cavia-network

  # Redis for RQ (task queue)
  redis:
    image: redis:7-alpine
    container_name: cavia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cavia-network

  # MinIO for CV storage
  minio:
    image: minio/minio:latest
    container_name: cavia-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cavia-network

  # MinIO client for bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: cavia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing minio/cvs-raw;
      mc mb --ignore-existing minio/cvs-processed;
      mc mb --ignore-existing minio/agent-artifacts;
      mc policy set download minio/cvs-processed;
      echo 'MinIO buckets initialized';
      "
    networks:
      - cavia-network

  # Agent Registry Service
  agent-registry:
    build:
      context: .
      dockerfile: backend/Dockerfile.registry
    container_name: cavia-agent-registry
    environment:
      DATABASE_URL: postgresql://cavia:${POSTGRES_PASSWORD:-caviadev123}@postgres:5432/cavia
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - cavia-network

  # RQ Dashboard (optional, for monitoring queues)
  rq-dashboard:
    image: eoranged/rq-dashboard:latest
    platform: linux/amd64
    container_name: cavia-rq-dashboard
    environment:
      RQ_DASHBOARD_REDIS_URL: redis://redis:6379/0
    ports:
      - "9181:9181"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cavia-network

  # Backend API Service
  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    container_name: cavia-backend-api
    environment:
      # Infrastructure
      DATABASE_URL: postgresql://cavia:${POSTGRES_PASSWORD:-caviadev123}@postgres:5432/cavia
      REDIS_URL: redis://redis:6379/0

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_SECURE: "false"

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      orchestrator-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - cavia-network

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cavia-frontend
    ports:
      - "3000:80"
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - cavia-network

  # ============================================================================
  # AGENTIC UNITS - CV Processing Agents
  # ============================================================================

  # Parser Agent - Extracts structured data from CVs
  parser-agent:
    image: cavia-parser:latest
    container_name: cavia-parser-agent
    environment:
      # Agent Config
      AGENT_ID: parser-001
      QUEUE_NAME: parser

      # Infrastructure
      DATABASE_URL: postgresql://cavia:${POSTGRES_PASSWORD:-caviadev123}@postgres:5432/cavia
      REDIS_URL: redis://redis:6379/0

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_SECURE: "false"

      # Logging
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cavia-network

  # Evaluator Agents - LLM-based evaluation (3 instances for parallel processing)
  evaluator-agent-1:
    image: cavia-evaluator:latest
    container_name: cavia-evaluator-agent-1
    environment:
      # Agent Config
      AGENT_ID: evaluator-001
      QUEUE_NAME: evaluator

      # Infrastructure
      DATABASE_URL: postgresql://cavia:${POSTGRES_PASSWORD:-caviadev123}@postgres:5432/cavia
      REDIS_URL: redis://redis:6379/0

      # Ollama LLM
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}

      # Logging
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cavia-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  evaluator-agent-2:
    image: cavia-evaluator:latest
    container_name: cavia-evaluator-agent-2
    environment:
      # Agent Config
      AGENT_ID: evaluator-002
      QUEUE_NAME: evaluator

      # Infrastructure
      DATABASE_URL: postgresql://cavia:${POSTGRES_PASSWORD:-caviadev123}@postgres:5432/cavia
      REDIS_URL: redis://redis:6379/0

      # Ollama LLM
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}

      # Logging
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cavia-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  evaluator-agent-3:
    image: cavia-evaluator:latest
    container_name: cavia-evaluator-agent-3
    environment:
      # Agent Config
      AGENT_ID: evaluator-003
      QUEUE_NAME: evaluator

      # Infrastructure
      DATABASE_URL: postgresql://cavia:${POSTGRES_PASSWORD:-caviadev123}@postgres:5432/cavia
      REDIS_URL: redis://redis:6379/0

      # Ollama LLM
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}

      # Logging
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cavia-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Orchestrator Agent - Workflow coordinator
  orchestrator-agent:
    image: cavia-orchestrator:latest
    container_name: cavia-orchestrator-agent
    environment:
      # Agent Config
      AGENT_ID: orchestrator-001
      QUEUE_NAME: orchestrator
      QUEUE_ORCHESTRATION: orchestrator

      # Infrastructure
      DATABASE_URL: postgresql://cavia:${POSTGRES_PASSWORD:-caviadev123}@postgres:5432/cavia
      REDIS_URL: redis://redis:6379/0

      # Logging
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cavia-network

  # Reporter Agent - Generates evaluation reports
  reporter-agent:
    image: cavia-reporter:latest
    container_name: cavia-reporter-agent
    environment:
      # Agent Config
      AGENT_ID: reporter-001
      QUEUE_NAME: reporter

      # Infrastructure
      DATABASE_URL: postgresql://cavia:${POSTGRES_PASSWORD:-caviadev123}@postgres:5432/cavia
      REDIS_URL: redis://redis:6379/0

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_SECURE: "false"

      # Ollama LLM
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}

      # Logging
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cavia-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

networks:
  cavia-network:
    driver: bridge
